# Teaching-reference manifest for the mouth build.
#
# Each entry becomes one frame in the "how this part works" flash-through,
# shown in order, followed by the rotating 3D model (if `model` is set on
# the last entry, or once we decide how that is picked).
#
# Schema:
# - file: images/<filename>       # path relative to this folder
#   title: "Short title"
#   description: >
#     Plain-English explanation, written for Henry to hear out loud.
#   kind: photo                   # photo | cad
#   model: models/<filename>      # optional — only once a finished 3D model exists
#
# Example (remove the leading "# " once a real entry is added):
# - file: images/example.jpg
#   title: "Example title"
#   description: >
#     Example description.
#   kind: photo

images:
- file: images/Mouth Bracket Drawing 1.pdf
  title: "The mouth bracket"
  description: >
    This is the holder for Qbot's mouth screen. It's about as wide as your
    hand. The screen sits in the front, and the tiny computer that draws the
    mouth is on the back. Four bolts in the corners hold it onto the front of
    Qbot's head, just under his eyes.
  kind: cad
  model: models/MouthInsert - Mouth Bracket.3mf
  henry_text_approved: true
