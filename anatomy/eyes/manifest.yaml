# Teaching-reference manifest for the eyes build.
#
# Each entry becomes one frame in the "how this part works" flash-through,
# shown in order, followed by the rotating 3D model (if `model` is set on
# the last entry, or once we decide how that is picked).
#
# Schema:
# - file: images/<filename>       # path relative to this folder
#   title: "Short title"
#   description: >
#     Plain-English explanation, written for Henry to hear out loud.
#   kind: photo                   # photo | cad
#   model: models/<filename>      # optional — only once a finished 3D model exists
#
# Example (remove the leading "# " once a real entry is added):
# - file: images/example.jpg
#   title: "Example title"
#   description: >
#     Example description.
#   kind: photo

images:
- file: images/Eye Plate.pdf
  title: "The eye plate"
  description: >
    This is the plate that holds Qbot's eyes. It's about as long as a school
    ruler. Each round screen sits in one of the two big holes, and on the back
    there are four little bolt holes where the tiny computer for the eyes is
    screwed on. The whole plate bolts onto the front of Qbot's head.
  kind: cad
  model: models/Eye Insert - Eye Bracket.3mf
  henry_text_approved: true
