[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot4henry"
description = "Qbot - AI powered robot brain for Henry"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    "ollama>=0.1.0",
    "chromadb>=0.4.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
voice = [
    "openai-whisper>=20230918",
    "pyaudio>=0.2.13",
]
vision = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
]
hardware = [
    "pyserial>=3.5",
]

[project.scripts]
qbot = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brain*", "config*", "nervous_system*", "organs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "llm: exercises the real Ollama model — slow, needs `ollama serve` running, non-deterministic",
]
addopts = "-m 'not llm'"

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml"]